<!doctype html>
<html><head><meta charset="utf-8"><title>Inbox (12)</title>
<style>
  body { margin:0; font-family:"Ubuntu", "DejaVu Sans", sans-serif; background:#16161a; color:#e4e4e7; display:grid; grid-template-columns:200px 380px 1fr; height:100vh; font-size:14px; }
  .nav { padding:14px 0; background:#0f0f12; } .nav div { padding:7px 18px; color:#a1a1aa; } .nav .on { color:#fff; background:#27272a; border-left:3px solid #a78bfa; }
  .nav .c { float:right; color:#a78bfa; }
  .list { border-right:1px solid #27272a; overflow:hidden; } .search { margin:12px; padding:9px 12px; background:#27272a; border-radius:8px; color:#71717a; }
  .item { padding:12px 16px; border-bottom:1px solid #222226; cursor:pointer; } .item:hover, .item.hov { background:#1f1f24; } .item.sel { background:#2e2a3d; }
  .from { font-weight:700; } .item.read .from { font-weight:400; color:#a1a1aa; } .subj { margin-top:3px; } .prev { color:#71717a; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .time { float:right; color:#71717a; font-size:12px; }
  .read-pane { padding:24px 32px; } .read-pane h1 { font-size:22px; margin:0 0 10px; } .meta { color:#a1a1aa; margin-bottom:22px; } .body p { line-height:1.6; color:#d4d4d8; }
  .btn { display:inline-block; border:1px solid #3f3f46; border-radius:6px; padding:6px 14px; margin-right:8px; color:#d4d4d8; }
</style></head>
<body>
<div class="nav"><div class="on">Inbox <span class="c">12</span></div><div>Starred</div><div>Snoozed</div><div>Sent</div><div>Drafts <span class="c">2</span></div><div>Spam</div></div>
<div class="list"><div class="search">Search mail</div><div id="items"></div></div>
<div class="read-pane" id="pane"><div style="color:#71717a;margin-top:40vh;text-align:center">Select a message to read</div></div>
<script>
  const mails = [
    ["GitHub", "9:41 AM", "[acme/api] PR #482: Add rate limiting", "@marcus requested your review on this pull request."],
    ["Priya Natarajan", "9:12 AM", "Q3 review deck — final draft", "Attached the final version, can you check slide 4 before noon?"],
    ["Stripe", "8:30 AM", "Your November invoice is ready", "Invoice INV-2027-11 for $1,284.00 is now available."],
    ["Linear", "Yesterday", "3 issues assigned to you", "ENG-1201 Flaky e2e login test, ENG-1188 CSV export..."],
    ["Marcus Webb", "Yesterday", "Postgres failover drill", "Drill is scheduled for Thursday 2pm, runbook linked."],
    ["Calendar", "Mon", "Invitation: Platform sync", "Weekly on Tuesdays 10:00 - 10:30"],
  ];
  document.getElementById("items").innerHTML = mails.map((m, i) => `<div class="item" data-i="${i}"><span class="time">${m[1]}</span><div class="from">${m[0]}</div><div class="subj">${m[2]}</div><div class="prev">${m[3]}</div></div>`).join("");
  document.addEventListener("click", (e) => {
    const it = e.target.closest(".item"); if (!it) return;
    document.querySelectorAll(".item").forEach((x) => x.classList.remove("sel")); it.classList.add("sel", "read");
    const m = mails[it.dataset.i];
    document.getElementById("pane").innerHTML = `<h1>${m[2]}</h1><div class="meta">${m[0]} · ${m[1]}</div><div><span class="btn">Reply</span><span class="btn">Forward</span><span class="btn">Archive</span></div><div class="body"><p>Hi,</p><p>${m[3]}</p><p>Let me know if anything looks off — happy to jump on a call.</p><p>Thanks,<br>${m[0].split(" ")[0]}</p></div>`;
  });
</script>
</body></html>
